name: Pre-deploy checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sql-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SQL bind parameter safety
        run: python scripts/check_sql_safety.py
