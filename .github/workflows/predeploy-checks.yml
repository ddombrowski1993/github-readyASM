name: Pre-deploy checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sql-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check SQL bind parameter safety
        run: python scripts/check_sql_safety.py

  bet-service-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bet_service_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BET_TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/bet_service_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: BET acceptance and existing account regression tests
        run: python -m pytest tests -q
